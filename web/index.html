<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_first_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_first_app</title>
  <link rel="manifest" href="manifest.json">
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>
  <script>
    (() => {
      const attachModelStatus = (viewer) => {
        if (viewer.dataset.amMotionStatus === 'ready') return;
        viewer.dataset.amMotionStatus = 'ready';
        const host = viewer.parentElement;
        if (!host) return;
        host.style.position = 'relative';
        const status = document.createElement('div');
        status.setAttribute('role', 'status');
        status.setAttribute('aria-live', 'polite');
        status.style.cssText = 'position:absolute;z-index:10;left:12px;right:12px;bottom:12px;padding:9px 12px;border-radius:10px;background:rgba(9,14,26,.9);color:#E7ECF5;border:1px solid rgba(148,173,214,.36);font:13px sans-serif;text-align:center;pointer-events:none;';
        status.textContent = 'Preparing 3D preview…';
        host.appendChild(status);
        viewer.addEventListener('progress', (event) => {
          const amount = Math.round((event.detail?.totalProgress || 0) * 100);
          status.textContent = `Loading model ${amount}%`;
          status.style.display = '';
        });
        viewer.addEventListener('load', () => status.remove());
        viewer.addEventListener('error', () => {
          status.textContent = 'Could not load this model. Check the GLB and pack its textures into the file.';
          status.style.color = '#FFD7D7';
          status.style.borderColor = '#B65F70';
          status.style.display = '';
        });
      };
      const scan = () => document.querySelectorAll('model-viewer').forEach(attachModelStatus);
      new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
      scan();
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
