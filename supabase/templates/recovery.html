<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AM MOTION LAB password reset</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#0b1220;color:#e7eefc;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#111b2e;border:1px solid #263653;border-radius:18px;">
      <tr>
        <td align="center" style="padding:32px 28px 12px;">
          <img src="{{ .SiteURL }}/icons/am-motion-icon.png" width="72" height="72" alt="AM MOTION LAB" style="display:block;width:72px;height:72px;object-fit:contain;border:0;">
          <p style="margin:14px 0 0;color:#a9c9ff;font-size:12px;font-weight:bold;letter-spacing:2px;">AM MOTION LAB</p>
        </td>
      </tr>
      <tr>
        <td style="padding:20px 32px 34px;">
          <h1 style="margin:0 0 12px;color:#ffffff;font-size:24px;line-height:1.3;">Reset your password</h1>
          <p style="margin:0 0 22px;color:#c4cee0;font-size:15px;line-height:1.6;">Use this one-time code in the AM Motion Lab app to choose a new password. You do not need to open a link.</p>
          <div style="padding:18px 12px;background:#0b1220;border:1px solid #34476a;border-radius:12px;color:#ffffff;text-align:center;font-size:32px;font-weight:bold;letter-spacing:10px;">{{ .Token }}</div>
          <p style="margin:22px 0 0;color:#c4cee0;font-size:14px;line-height:1.6;">If you didn’t request this code, you can safely ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
